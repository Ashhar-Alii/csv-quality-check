version: 2

models:
  - name: stg_orders
    description: >
      Typed view over whatever CSV currently sits in the landing volume.
      Nothing here is a copy -- it re-reads the volume on every run.
    columns:
      - name: order_id
        description: Unique identifier for the order.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Identifier for the customer who placed the order.
        tests:
          - not_null
      - name: amount
        description: Order total.
        tests:
          - not_null
      - name: status
        description: Current order status.
        tests:
          - accepted_values:
              values: ['pending', 'processing', 'shipped', 'delivered', 'cancelled']
